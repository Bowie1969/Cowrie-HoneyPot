# Cowrie honeypot config — operator overrides (layered over the bundled defaults).
#
# Host identity: a neglected Ubuntu 18.04 production database box. Every value
# here is chosen so that banner, OS, kernel, and filesystem all tell the same
# story — an old, unpatchable server that looks like an easy prize.
#
# All credentials/files referenced by this honeypot are FABRICATED decoys.

[honeypot]
hostname = prod-db-01
sensor_name = syd1-prod-db-01

[ssh]
# OpenSSH 7.6p1 is the Ubuntu 18.04 build — old, EOL, and a magnet for scanners.
version = SSH-2.0-OpenSSH_7.6p1 Ubuntu-4ubuntu0.7
# Cowrie binds port 22 directly via authbind (real sshd is moved to 2200).
listen_endpoints = tcp:22:interface=0.0.0.0

[shell]
filesystem = /opt/cowrie/custom.pickle
# Match uname output to Ubuntu 18.04 (4.15 kernel series).
kernel_version = 4.15.0-213-generic
kernel_build_string = #224-Ubuntu SMP Mon Jun 19 13:02:09 UTC 2023

[telnet]
enabled = false

[output_jsonlog]
enabled = true
logfile = ${honeypot:log_path}/cowrie.json
