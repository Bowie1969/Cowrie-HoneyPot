# Cowrie challenge instance config - operator overrides.
# A "flag hunt + stealth" target for invited researchers: 4 flags hidden,
# honeytoken files that count as "detected" if touched, and everything logged.

[honeypot]
hostname = ctf-box
sensor_name = syd1-ctf-box

[ssh]
version = SSH-2.0-OpenSSH_7.6p1 Ubuntu-4ubuntu0.7
# 2222 keeps it separate from the blackhat instance on 22 (same droplet).
listen_endpoints = tcp:2222:interface=0.0.0.0

[shell]
filesystem = /opt/challenge/custom.pickle
kernel_version = 4.15.0-213-generic
kernel_build_string = #224-Ubuntu SMP Mon Jun 19 13:02:09 UTC 2023

[telnet]
enabled = false

[output_jsonlog]
enabled = true
logfile = ${honeypot:log_path}/cowrie.json
